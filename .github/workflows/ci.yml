name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm run typecheck
      - run: npm test
      # Pack the package and run the user flow through npx, as users will.
      - run: npm run smoke
        shell: bash
