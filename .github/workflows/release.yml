# Publishes ssdd to npm when a version tag is pushed:
#   npm version patch && git push --follow-tags
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # GitHub release
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm run smoke
      # prepublishOnly runs the type check and tests; prepack builds dist/cli.mjs.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
